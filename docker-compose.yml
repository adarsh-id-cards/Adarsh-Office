name: pro-office

services:
  db:
    image: postgres:17-alpine
    container_name: pro_office_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pro_office_db}
      POSTGRES_USER: ${POSTGRES_USER:-pro_office_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-strong-db-password}
      TZ: ${TZ:-Asia/Kolkata}
    ports:
      - "${PRO_OFFICE_DB_PORT:-5434}:5432"
    volumes:
      - pro_office_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pro_office_user} -d ${POSTGRES_DB:-pro_office_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pro_office_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pro_office_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.production}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-prod-secret-key-replace-in-env-file}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      POSTGRES_DB: ${POSTGRES_DB:-pro_office_db}
      POSTGRES_USER: ${POSTGRES_USER:-pro_office_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-strong-db-password}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8088,http://127.0.0.1:8088}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8088,http://127.0.0.1:8088}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-False}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-False}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@adarshidcards.local}
      INITIAL_ADMIN_FULL_NAME: ${INITIAL_ADMIN_FULL_NAME:-System Administrator}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      TZ: ${TZ:-Asia/Kolkata}
    ports:
      - "${PRO_OFFICE_BACKEND_PORT:-8008}:8000"
    volumes:
      - pro_office_backend_static:/app/staticfiles
      - pro_office_backend_media:/app/media
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/health/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pro_office_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_APP_NAME: ${VITE_APP_NAME:-Pro Office}
        VITE_APP_COMPANY: ${VITE_APP_COMPANY:-Adarsh ID Cards}
    container_name: pro_office_frontend
    restart: unless-stopped
    ports:
      - "${PRO_OFFICE_FRONTEND_PORT:-5178}:80"
    networks:
      - pro_office_net

  nginx:
    image: nginx:1.27-alpine
    container_name: pro_office_nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "${PRO_OFFICE_HTTP_PORT:-8088}:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - pro_office_backend_static:/var/www/backend-static:ro
      - pro_office_backend_media:/var/www/backend-media:ro
    networks:
      - pro_office_net

volumes:
  pro_office_postgres_data:
    name: pro_office_postgres_data
  pro_office_backend_static:
    name: pro_office_backend_static
  pro_office_backend_media:
    name: pro_office_backend_media

networks:
  pro_office_net:
    name: pro_office_net
    driver: bridge
