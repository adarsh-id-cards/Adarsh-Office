upstream pro_office_backend {
    server backend:8000;
}

upstream pro_office_frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy versioned REST API requests to Django backend
    location /api/ {
        proxy_pass http://pro_office_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Proxy Django Admin to backend
    location /admin/ {
        proxy_pass http://pro_office_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Serve Django collected static assets
    location /static/ {
        alias /var/www/backend-static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Serve uploaded media files
    location /media/ {
        alias /var/www/backend-media/;
        expires 7d;
    }

    # Route all application paths to Frontend container (React Router SPA)
    location / {
        proxy_pass http://pro_office_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
